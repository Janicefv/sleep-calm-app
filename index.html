<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sleep & Calm: alarmas personalizadas y rutinas mañaneras para descansar mejor."
    />
    <title>Sleep & Calm</title>
    <link rel="stylesheet" href="src/styles.css" />
    <script src="src/app.js" defer></script>

    <main class="home">
      <section class="hero">
        <span class="hero__badge">Tu descanso, a tu ritmo</span>
        <h1 class="hero__title">Sleep <span>&amp;</span> Calm</h1>
        <p class="hero__tagline">Duerme mejor. Despierta con calma.</p>

          Una alarma personalizada y una rutina mañanera suave para empezar el
          día con claridad y sin prisas.
        </p>
        <div class="hero__actions">
          <button class="button button--primary" type="button">
            Configurar alarma
          </button>
          <button class="button button--secondary" type="button">
            Ver rutina mañanera
          </button>
        </div>
        <p class="hero__note">MVP · Próximamente</p>
      </section>
